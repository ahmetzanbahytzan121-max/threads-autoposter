name: Threads Cloud Autoposter

on:
  schedule:
    # Время указано в UTC (для Алматы/Астаны UTC+5 это 10:30, 14:30, 19:00, 22:00)
    - cron: "30 5 * * *"
    - cron: "30 9 * * *"
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-next-thread:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build runtime .env from GitHub Secrets
        shell: bash
        env:
          PROMO_CODE: ${{ secrets.PROMO_CODE }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: |
          cat << 'EOF' > .env
          PROMO_CODE=${PROMO_CODE}
          THREADS_ACCESS_TOKEN=${THREADS_ACCESS_TOKEN}
          THREADS_USER_ID=${THREADS_USER_ID}
          LOOP_QUEUE=true
          REPLY_DELAY_SEC=3
          IMAGE_BASE_URL=${IMAGE_BASE_URL}
          EOF

      - name: Publish next Threads post
        run: python autoposter.py post-next

      - name: Commit updated state.json
        run: |
          rm -f .env
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update threads autoposter state [skip ci]"
            git push
          fi
