name: Threads Cloud Autoposter

on:
  schedule:
    # Время указано в UTC (для Алматы/Астаны UTC+5 это 13:30 и 20:30 — оптимальный темп 2 поста/день на прогреве)
    - cron: "30 8 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-next-thread:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build runtime .env from GitHub Secrets
        shell: python
        env:
          PROMO_CODE: ${{ secrets.PROMO_CODE }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: |
          import os
          from pathlib import Path

          lines = [
              f"PROMO_CODE={os.environ.get('PROMO_CODE', '').strip()}",
              f"THREADS_ACCESS_TOKEN={os.environ.get('THREADS_ACCESS_TOKEN', '').strip()}",
              f"THREADS_USER_ID={os.environ.get('THREADS_USER_ID', '').strip()}",
              "LOOP_QUEUE=true",
              "REPLY_DELAY_SEC=3",
              f"IMAGE_BASE_URL={os.environ.get('IMAGE_BASE_URL', '').strip()}",
          ]
          Path(".env").write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Publish next Threads post
        run: python autoposter.py post-next

      - name: Commit updated state.json
        run: |
          rm -f .env
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update threads autoposter state [skip ci]"
            git push
          fi
